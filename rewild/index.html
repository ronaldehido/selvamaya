<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioTablero ReWild | Spider monkey</title>

  <link rel="stylesheet" href="css/style.css" />

  <!-- D3.js -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>
  <main class="dashboard">

    <section class="hero">
      <h1 id="hero-title"></h1>
      <p id="hero-description"></p>
    </section>

    <section class="card audio-card">
      <div class="chart-header">
        <div>
          <h2>Sounds of spider monkeys</h2>
          <p>compilation of vocalizations of spider monkeys</p>
        </div>
      </div>

      <div class="audio-player">
        <button id="play-audio" class="play-button">▶</button>
        <div id="waveform"></div>
      </div>
    </section>

    <section class="card">
      <div class="chart-header">
        <div>
          <h2>Activity during the day</h2>
          <p>Detections grouped by 30-minute intervals</p>
          <p>Maximum values detected during sampling are displayed</p>
        </div>
        <strong>24 h</strong>
      </div>

      <div id="circular-chart"></div>

      <div id="tooltip" class="tooltip"></div>
    </section>

    <section class="card">
      <div class="chart-header">
        <div>
          <h2>Relative detection probability</h2>
          <p>Distribution of acoustic detections by hour of the day</p>
        </div>
      </div>
      <div id="heatmap-chart"></div>
    </section>

    <section class="card project-card">
      <div id="project-content"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

  <script src="js/content-loader.js"></script>
  <script src="js/project-loader.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
